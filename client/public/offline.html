<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#00853F" />
  <title>PulseBoard — Connexion requise</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f6;color:#18211e;font-family:Inter,Segoe UI,Arial,sans-serif}.card{max-width:430px;background:#fff;border:1px solid #dce5e1;border-radius:18px;padding:28px;text-align:center;box-shadow:0 18px 45px #14251f12}.logo{width:72px;height:72px;border-radius:18px;margin-bottom:15px}h1{font-size:22px;margin:0 0 9px;color:#08775a}p{font-size:14px;line-height:1.6;color:#68736f}button{border:0;border-radius:10px;background:#08775a;color:#fff;font:inherit;font-weight:700;padding:11px 18px;cursor:pointer;margin-top:9px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icons/icon-192.png" alt="PulseBoard" />
    <h1>Connexion Internet requise</h1>
    <p>PulseBoard protège les dossiers patients et ne les conserve pas hors ligne sur ce téléphone. Reconnectez-vous pour accéder au service.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
